[project]
name = "coverletter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.25.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "fpdf2>=2.7.0",
    "voyageai>=0.2.0",
    "pypdf>=4.0.0",
    "rank-bm25>=0.2.2",
    "odfpy>=1.4.1",
    "streamlit>=1.32.0",
    "mistralai>=2.4.8",
    "openai>=2.38.0",
]

[project.scripts]
coverletter = "coverletter.cli:main"

[tool.setuptools.packages.find]
include = ["coverletter*"]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"
